<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Derek Coleman</title>
<meta name="description" content="Get in touch with Derek Coleman.">
<link rel="canonical" href="https://derekcoleman.com/contact/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Derek Coleman">
<meta property="og:title" content="Contact — Derek Coleman">
<meta property="og:description" content="Get in touch with Derek Coleman.">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="../">Derek Coleman</a>
  <nav class="main">
    <a href="../#work">Work</a>
    <a href="../contact/">Contact</a>
    <a href="https://www.dcassociatesgroup.com" rel="noopener">DC Associates Group</a>
  </nav>
</div></header>
<main>
<section><div class="wrap">
  <h2>Contact</h2>
  <p style="color:var(--muted);margin-bottom:1.4rem">
    Send a note below, or email
    <a href="mailto:derek@derekcoleman.com">derek@derekcoleman.com</a> directly.</p>
  <form class="contact" id="contact-form" data-contact novalidate>
  <div class="row2">
    <label>Name<input type="text" name="name" autocomplete="name" maxlength="200" required></label>
    <label>Email<input type="email" name="email" autocomplete="email" maxlength="320" required></label>
  </div>
  <div class="row2">
    <label>Company <span style="font-weight:400;color:var(--muted)">(optional)</span>
      <input type="text" name="company" autocomplete="organization" maxlength="300"></label>
    <label>Topic<select name="topic" required><option value="General">General</option><option value="Consulting">Consulting</option><option value="Speaking">Speaking</option><option value="Other">Other</option></select></label>
  </div>
  <label>Message<textarea name="message" maxlength="5000" required></textarea></label>
  <div class="hp-field" aria-hidden="true">
    <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
  </div>
  <p class="form-msg" role="status" aria-live="polite"></p>
  <button class="btn" type="submit">Send message</button>
</form>
</div></section>

</main>
<footer class="site"><div class="wrap">
  <span>© 2026 Derek Coleman</span>
  <span>
    <a href="mailto:derek@derekcoleman.com">derek@derekcoleman.com</a> ·
    <a href="https://www.linkedin.com/company/derek-coleman-associates-group-inc" rel="noopener">LinkedIn</a> ·
    <a href="https://github.com/Derek-Coleman-Associates-Corporation" rel="noopener">GitHub</a>
  </span>
</div></footer>
<script src="../assets/contact.js" defer></script>
</body>
</html>
